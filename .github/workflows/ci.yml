name: Rust CI

on:
  push:
    branches:
      - main
      - "v0.1/**"
      - "v0.2/**"
  pull_request:
    branches:
      - main
      - "v0.1/implementation"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, test and document
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Validate workspace metadata
        run: cargo metadata --no-deps --format-version 1

      - name: Enforce dependency boundaries
        shell: bash
        run: |
          test "$(cargo tree -p ese-domain --edges normal | wc -l)" -eq 1
          test "$(cargo tree -p ese-config --edges normal | wc -l)" -eq 1

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Build documentation
        run: cargo doc --workspace --no-deps --locked

      - name: Audit dependencies
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Verify declared MSRV
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 check --workspace --all-targets --locked
